<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome Back Embed</title>
  <style>
    @font-face {
      font-family: "Separated";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/SEPARATED.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Sans";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/GamuthSans-Regular.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Sans";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/GamuthSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Display";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/Gamuth%20Display%20Black.ttf") format("truetype");
      font-weight: 900;
      font-display: swap;
    }

    :root {
      --ink: #ffffff;
      --ink-soft: rgba(255, 255, 255, 0.8);
      --base: #141414;
      --panel: rgba(0, 0, 0, 0.12);
      --field: rgba(224, 224, 224, 0.98);
      --field-text: #1a1a1a;
      --hot: #ff4a57;
      --cool: #b13cff;
      --line: rgba(255, 255, 255, 0.92);
      --shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    * {
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: "Gamuth Sans", system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input {
      font: inherit;
    }

    .embed {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 44px);
      isolation: isolate;
    }

    .artboard {
      width: min(860px, 100%);
      display: grid;
      gap: clamp(18px, 3vw, 30px);
      align-items: start;
      justify-items: center;
      position: relative;
      animation: rise 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .artboard::before {
      content: "";
      position: absolute;
      inset: -30px -36px -34px;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 22%, rgba(0, 0, 0, 0.84) 0%, rgba(0, 0, 0, 0.66) 36%, rgba(0, 0, 0, 0.22) 62%, transparent 80%),
        linear-gradient(180deg, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.2) 68%, transparent 100%);
      filter: blur(2px);
    }

    .title-wrap {
      width: 100%;
      position: relative;
      display: grid;
      place-items: center;
      padding-top: clamp(8px, 1.8vw, 18px);
      padding-bottom: clamp(6px, 1.6vw, 14px);
    }

    .title-band {
      position: absolute;
      left: 50%;
      top: 48%;
      width: min(920px, 108vw);
      height: 78px;
      transform: translate(-50%, -50%);
      background-image: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/purple_spiral.svg");
      background-repeat: repeat-x;
      background-size: 40px 40px;
      background-position: center;
      opacity: 0.4;
      mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.96) 14%, rgba(0, 0, 0, 0.96) 86%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.96) 14%, rgba(0, 0, 0, 0.96) 86%, transparent 100%);
      filter: hue-rotate(338deg) saturate(2.2) brightness(1.1);
      pointer-events: none;
    }

    .title-band.cool {
      transform: translate(-50%, -42%) scaleY(0.78);
      opacity: 0.26;
      filter: hue-rotate(276deg) saturate(2.4) brightness(1.12);
    }

    .title {
      margin: 0;
      position: relative;
      z-index: 1;
      font-family: "Separated", "Gamuth Display", sans-serif;
      font-size: clamp(3.8rem, 11vw, 6.9rem);
      line-height: 0.82;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      color: var(--ink);
      text-shadow:
        0 3px 0 rgba(0, 0, 0, 0.2),
        0 12px 26px rgba(0, 0, 0, 0.18);
      transform: translateX(0.02em);
    }

    .title::before,
    .title::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.78;
    }

    .title::before {
      transform: translate(-0.1em, 0.03em);
      color: var(--hot);
      clip-path: inset(0 49.2% 0 0);
    }

    .title::after {
      transform: translate(0.11em, -0.02em);
      color: var(--cool);
      clip-path: inset(0 0 0 49.4%);
    }

    .form {
      width: min(620px, 100%);
      display: grid;
      gap: clamp(18px, 2.8vw, 26px);
      justify-items: start;
    }

    .field {
      width: 100%;
      display: grid;
      gap: 12px;
      position: relative;
    }

    .label {
      position: relative;
      z-index: 1;
      margin-left: 0;
      font-family: "Gamuth Sans", system-ui, sans-serif;
      font-size: clamp(1.45rem, 3.4vw, 2.05rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.14);
    }

    .field-shell {
      position: relative;
      width: 100%;
      height: clamp(72px, 10vw, 102px);
    }

    .field-shell::before,
    .field-shell::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/purple_spiral.svg");
      background-repeat: repeat;
      background-size: 46px 46px;
      background-position: center;
      opacity: 0.26;
      mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.96) 14%, rgba(0, 0, 0, 0.96) 86%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.96) 14%, rgba(0, 0, 0, 0.96) 86%, transparent 100%);
      mix-blend-mode: screen;
    }

    .field--warm .field-shell::before {
      filter: hue-rotate(350deg) saturate(2.3) brightness(1.08);
    }

    .field--warm .field-shell::after {
      opacity: 0.18;
      transform: translateY(10px) scale(1.04);
      filter: hue-rotate(8deg) saturate(2.15) brightness(1.06);
    }

    .field--cool .field-shell::before {
      filter: hue-rotate(284deg) saturate(2.2) brightness(1.08);
    }

    .field--cool .field-shell::after {
      opacity: 0.18;
      transform: translateY(10px) scale(1.04);
      filter: hue-rotate(317deg) saturate(2.2) brightness(1.06);
    }

    .input {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      padding: 0 clamp(22px, 3vw, 34px);
      background: var(--field);
      color: var(--field-text);
      font-size: clamp(1.05rem, 2.5vw, 1.55rem);
      line-height: 1;
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    }

    .input::placeholder {
      color: rgba(26, 26, 26, 0.82);
      opacity: 1;
    }

    .input:focus-visible {
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.12),
        0 0 0 3px rgba(255, 255, 255, 0.26);
    }

    .cta-wrap {
      width: 100%;
      display: grid;
      place-items: center;
      padding-top: clamp(14px, 2vw, 22px);
    }

    .cta {
      min-width: min(100%, 312px);
      height: clamp(72px, 10vw, 94px);
      padding: 0 clamp(28px, 4vw, 42px);
      border: 2px solid var(--line);
      background: rgba(0, 0, 0, 0.8);
      color: var(--ink);
      font-family: "Gamuth Sans", system-ui, sans-serif;
      font-size: clamp(1.7rem, 4.6vw, 2.45rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      background: rgba(0, 0, 0, 0.9);
      box-shadow: 0 34px 80px rgba(0, 0, 0, 0.32);
    }

    .cta:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.78);
      outline-offset: 4px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.992);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      .artboard {
        gap: 16px;
      }

      .title-band {
        height: 58px;
        background-size: 34px 34px;
      }

      .form {
        gap: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .artboard,
      .cta {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="embed" aria-label="Welcome back login embed">
    <section class="artboard">
      <div class="title-wrap">
        <div class="title-band" aria-hidden="true"></div>
        <div class="title-band cool" aria-hidden="true"></div>
        <h1 class="title" data-text="WELCOME BACK">WELCOME BACK</h1>
      </div>

      <form class="form" onsubmit="event.preventDefault();">
        <label class="field field--warm">
          <span class="label">Email</span>
          <span class="field-shell">
            <input class="input" type="email" name="email" placeholder="Enter your email" autocomplete="email" />
          </span>
        </label>

        <label class="field field--cool">
          <span class="label">Password</span>
          <span class="field-shell">
            <input class="input" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          </span>
        </label>

        <div class="cta-wrap">
          <button class="cta" type="submit">Login</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
