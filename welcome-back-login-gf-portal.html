<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome Back Embed</title>
  <style>
    @font-face {
      font-family: "Separated";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/SEPARATED.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Sans";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/GamuthSans-Regular.ttf") format("truetype");
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Sans";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/GamuthSans-Bold.ttf") format("truetype");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: "Gamuth Display";
      src: url("https://cdn.jsdelivr.net/gh/J35S1CA007/gymfusion-assets@main/Gamuth%20Font%20Family/Gamuth%20Display%20Black.ttf") format("truetype");
      font-weight: 900;
      font-display: swap;
    }

    :root {
      --ink: rgba(18, 18, 18, 0.96);
      --ink-soft: rgba(18, 18, 18, 0.72);
      --field-text: rgba(22, 22, 22, 0.9);
      --line: rgba(24, 24, 24, 0.86);
      --line-soft: rgba(24, 24, 24, 0.14);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: transparent;
    }

    * {
      box-sizing: border-box;
    }

    body {
      overflow: hidden;
      font-family: "Gamuth Sans", system-ui, sans-serif;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    button,
    input {
      font: inherit;
    }

    .embed {
      width: 100%;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(18px, 4vw, 44px);
      isolation: isolate;
    }

    .artboard {
      width: min(860px, 100%);
      display: grid;
      gap: clamp(18px, 3vw, 30px);
      align-items: start;
      justify-items: center;
      position: relative;
      animation: rise 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .title-wrap {
      width: 100%;
      position: relative;
      display: grid;
      place-items: center;
      padding-top: clamp(8px, 1.8vw, 18px);
      padding-bottom: clamp(6px, 1.6vw, 14px);
    }

    .title {
      margin: 0;
      position: relative;
      z-index: 1;
      font-family: "Separated", "Gamuth Display", sans-serif;
      font-size: clamp(3.8rem, 11vw, 6.9rem);
      line-height: 0.82;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-align: center;
      color: var(--ink);
      transform: translateX(0.02em);
    }

    .title::before,
    .title::after {
      content: none;
    }

    .form {
      width: min(400px, 100%);
      display: grid;
      gap: clamp(18px, 2.8vw, 26px);
      justify-items: start;
    }

    .field {
      width: 100%;
      display: grid;
      gap: 12px;
      position: relative;
    }

    .label {
      position: relative;
      z-index: 1;
      margin-left: 0;
      font-family: "Gamuth Sans", system-ui, sans-serif;
      font-size: clamp(1.45rem, 3.4vw, 2.05rem);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-shadow: none;
    }

    .field-shell {
      position: relative;
      width: 100%;
      height: clamp(72px, 10vw, 102px);
    }

    .input {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      border: 1px solid var(--line);
      border-radius: 0;
      padding: 0 clamp(22px, 3vw, 34px);
      background: transparent;
      color: var(--field-text);
      font-size: clamp(1.05rem, 2.5vw, 1.55rem);
      line-height: 1;
      outline: none;
      box-shadow: none;
    }

    .input::placeholder {
      color: rgba(22, 22, 22, 0.52);
      opacity: 1;
    }

    .input:focus-visible {
      box-shadow: 0 0 0 3px rgba(24, 24, 24, 0.12);
    }

    .cta-wrap {
      width: 100%;
      display: grid;
      place-items: center;
      padding-top: clamp(14px, 2vw, 22px);
    }

    .cta {
      width: min(250px, 100%);
      height: clamp(72px, 10vw, 94px);
      padding: 0 clamp(28px, 4vw, 42px);
      border: 2px solid var(--line);
      background: transparent;
      color: var(--ink);
      font-family: "Gamuth Sans", system-ui, sans-serif;
      font-size: 25px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.03em;
      cursor: pointer;
      box-shadow: var(--shadow);
      transition: transform 160ms ease, background-color 160ms ease, box-shadow 160ms ease;
    }

    .cta:hover {
      transform: translateY(-1px);
      background: rgba(0, 0, 0, 0.03);
      box-shadow: 0 20px 36px rgba(0, 0, 0, 0.08);
    }

    .cta:focus-visible {
      outline: 3px solid rgba(255, 255, 255, 0.78);
      outline-offset: 4px;
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.992);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 700px) {
      .artboard {
        gap: 16px;
      }

      .form {
        gap: 16px;
      }
    }

    @media (min-width: 701px) {
      .artboard {
        width: min(544px, 100%);
        background: transparent;
        border: 1px solid #ffffff;
        padding: clamp(24px, 4vw, 40px);
      }

      .title {
        font-size: 70px;
        color: #ffffff;
        white-space: nowrap;
      }

      .label {
        font-size: 19px;
        color: #ffffff;
      }

      .form {
        width: min(355px, 100%);
        justify-items: center;
      }

      .field-shell {
        height: 60px;
      }

      .input {
        font-size: 17.5px;
        background: #ffffff;
        border-color: #ffffff;
      }

      .cta {
        width: 150px;
        height: 60px;
        font-size: 18px;
        padding: 0;
        background: #000000;
        color: #ffffff;
        border-color: #ffffff;
      }

      .cta:hover {
        background: #ffffff;
        color: #000000;
        border-color: #000000;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .artboard,
      .cta {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="embed" aria-label="Welcome back login embed">
    <section class="artboard">
      <div class="title-wrap">
        <h1 class="title" data-text="WELCOME BACK">WELCOME BACK</h1>
      </div>

      <form class="form" onsubmit="event.preventDefault();">
        <label class="field field--warm">
          <span class="label">Email</span>
          <span class="field-shell">
            <input class="input" type="email" name="email" placeholder="Enter your email" autocomplete="email" />
          </span>
        </label>

        <label class="field field--cool">
          <span class="label">Password</span>
          <span class="field-shell">
            <input class="input" type="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          </span>
        </label>

        <div class="cta-wrap">
          <button class="cta" type="submit">Login</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
